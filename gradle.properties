mod_description=A satellite laser quarry for Ender IO. Satellite dishes charge a floating Laser Crystal on the Crystal Obelisk, the crystal fires its beam up to your own satellite, and the satellite reflects it down onto the chunks you pick on its map.\n\nFly the satellite to orbit from your own launch pad on a reusable rocket, power the quarry with Ender IO energy and capacitors, and upgrade everything through three tiers: Basic, Enhanced and Ender. With a Void Laser Crystal, Ender quarries mine asteroids from space instead.
